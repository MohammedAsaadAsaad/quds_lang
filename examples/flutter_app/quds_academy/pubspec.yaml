name: quds_academy
description: A bilingual, animated Quds learning studio written in Quds.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqlite_plus: 0.1.14
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  quds_lang:
    path: ../../..
flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
