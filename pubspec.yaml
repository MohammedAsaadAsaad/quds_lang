name: quds
description: >-
  Quds language compiler, standard library, CLI, LSP server, and debugger
  compiling indentation-based Quds (.quds) code to readable Dart and Flutter.
version: 0.1.0-alpha.1
homepage: https://github.com/MohammedAsaadAsaad/quds_lang
repository: https://github.com/MohammedAsaadAsaad/quds_lang
issue_tracker: https://github.com/MohammedAsaadAsaad/quds_lang/issues
topics:
  - language
  - compiler
  - dart
  - flutter
  - cli
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  analyzer: ">=6.4.1 <15.0.0"
  matcher: ^0.12.16
  yaml_edit: ^2.2.0
dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
  vm_service: ^15.4.0
executables:
  quds: quds
