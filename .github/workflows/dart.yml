name: Dart
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: python3 tool/audit_language.py --check
      - name: Quds math tests
        run: |
          set -euo pipefail
          dart run bin/quds.dart test test/math.quds
          dart run bin/quds.dart test test/math_accuracy.quds
          dart run bin/quds.dart test test/math_reference.quds
          dart run bin/quds.dart test test/math_api.quds
          dart run bin/quds.dart test test/math_operators.quds
          dart run bin/quds.dart test test/math_graph.quds
          dart run bin/quds.dart test test/math_graph_reference.quds
          dart run bin/quds.dart test test/math_weighted_graph.quds
          dart run bin/quds.dart test test/math_flow.quds
          dart run bin/quds.dart test test/math_plan.quds
          dart run bin/quds.dart test test/math_foundations.quds
          dart run bin/quds.dart test test/math_foundations_reference.quds
          dart run bin/quds.dart test test/math_foundations_imports.quds
          dart run bin/quds.dart test test/generic_methods.quds
          dart run bin/quds.dart test test/dart_generics.quds
          dart run bin/quds.dart test test/dart_generics_prefix.quds
          dart run bin/quds.dart test test/readonly_classes.quds
          dart run bin/quds.dart test test/readonly_graph.quds
          dart run bin/quds.dart test test/readonly_paths.quds
          dart run bin/quds.dart test test/math_symbolic.quds
          dart run bin/quds.dart test test/math_symbolic_imports.quds
          dart run bin/quds.dart test test/math_symbolic_reference.quds
          dart run bin/quds.dart test test/math_exact.quds
          dart run bin/quds.dart test test/math_exact_reference.quds
          dart run bin/quds.dart test test/math_autodiff.quds
          dart run bin/quds.dart test test/math_autodiff_reference.quds
          dart run bin/quds.dart test test/math_autodiff_imports.quds
          dart run bin/quds.dart test test/math_autodiff_alias.quds
          dart run bin/quds.dart test test/math_geometry.quds
          dart run bin/quds.dart test test/math_geometry_reference.quds
          dart run bin/quds.dart test test/math_interval.quds
          dart run bin/quds.dart test test/math_interval_imports.quds
          dart run bin/quds.dart test test/math_interval_reference.quds
          dart run bin/quds.dart test test/math_prefix.quds
          dart run bin/quds.dart test test/expect.quds
          dart run bin/quds.dart test test/index_assignment.quds
          dart run bin/quds.dart test test/typed_storage.quds
          dart run bin/quds.dart test test/typed_storage_prefix.quds
          dart run bin/quds.dart test test/typed_storage_core.quds
          reject() {
            local file="$1"
            local needle="$2"
            set +e
            out=$(dart run bin/quds.dart test "$file" 2>&1)
            code=$?
            set -e
            if [ "$code" -ne 65 ]; then
              echo "$file was expected to fail with compiler exit 65"
              exit 1
            fi
            printf '%s\n' "$out" | grep -q "$needle" || {
              echo "$file did not report $needle"
              printf '%s\n' "$out"
              exit 1
            }
          }
          reject test/expect_reject_arity.quds "value and the matcher"
          reject test/math_reject_log.quds "not callable"
          reject test/math_reject_show.quds "E200"
          reject test/math_reject_hide.quds "E200"
      - name: Compiler and platform integration tests
        run: dart test --reporter expanded
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: dart pub get --enforce-lockfile
      - run: python tool/audit_language.py --check
      - run: dart test test/lexer_test.dart test/parser_test.dart test/semantics_test.dart test/constants_test.dart test/native_function_values_test.dart test/target_platform_test.dart --reporter expanded
  flutter-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/flutter_app/quds_academy
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web --project-name quds_academy .
      - run: flutter pub get
      - run: dart run tool/build.dart
      - run: flutter test
      - run: dart run ../../../bin/quds.dart build web --no-web-resources-cdn
